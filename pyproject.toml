[project]
name = "coder-m1"
version = "0.1.0"
description = "Memory-Augmented Multi-Agent Software Engineering System"
requires-python = ">=3.10"
dependencies = [
    # LLM
    "anthropic>=0.100.0",
    # Workflow
    "langgraph>=0.4.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # Memory
    "chromadb>=1.0.0",
    # MCP
    "mcp>=1.27.0",
    # Data / Config
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    # Utilities
    "tiktoken>=0.12.0",
    "loguru>=0.7.0",
    "rich>=15.0.0",
    "click>=8.3.0",
    # Async
    "aiohttp>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
coder-m1 = "scripts.run_task:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
